<style>
:root{--bg:#eef2f1;--card:#fff;--tx:#17252a;--mut:#5a6b70;--bd:#d3dcdb;--ac:#17252a;--ok:#14803c;--okbg:#e2f4e8;--no:#b42318;--nobg:#fdeceb;--sel:#e9f1f0}

body[data-lv=starter]{--ac:#0b7f82}
body[data-lv=intermediate]{--ac:#3d5a98}
body[data-lv=advanced]{--ac:#b3401e}
@media (prefers-color-scheme:dark){body[data-lv=starter]{--ac:#4cc9cc}body[data-lv=intermediate]{--ac:#8fb0f5}body[data-lv=advanced]{--ac:#ff9a73}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:900px;margin:0 auto;padding:0 18px}
header{border-bottom:1px solid var(--bd);background:var(--card)}

header nav a{color:var(--mut);text-decoration:none;margin-left:16px;font-size:.95rem}
header nav a:hover{color:var(--ac)}
h1,h2{font-family:Charter,"Iowan Old Style",Georgia,serif;line-height:1.25}
h1{font-size:clamp(1.8rem,5vw,2.5rem);margin:.4em 0 .2em}
h2{font-size:1.35rem;margin:1.4em 0 .4em}
.sub{color:var(--mut);margin:0 0 18px;max-width:60ch}
main{padding:22px 0 50px}
.crumb{font-size:.9rem;color:var(--mut)}
.crumb a{color:var(--mut)}
.levels{display:grid;gap:14px;margin-top:20px}
.lv{display:block;background:var(--card);border:1px solid var(--bd);border-left:8px solid var(--c);border-radius:10px;padding:18px 20px;text-decoration:none;color:var(--tx)}
.lv:hover{border-color:var(--c)}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.card{display:block;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px 16px;text-decoration:none;color:var(--tx)}
a.card:hover{border-color:var(--ac)}
.card b{display:block;margin-bottom:2px}
.meta{color:var(--mut);font-size:.9rem}
.best{color:var(--ok);font-size:.9rem}
.tabs{display:flex;gap:6px;margin:16px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap}

.tabs a.on{color:var(--ac);border-color:var(--ac);font-weight:600}
.box{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px 16px;margin:12px 0}
.pass{white-space:pre-line;font-family:Charter,Georgia,serif;font-size:1.02rem}
.q{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px 16px;margin:12px 0}

.q label{display:block;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;margin:6px 0;cursor:pointer}
.q label:hover,.q label:has(input:checked){background:var(--sel);border-color:var(--ac)}
.q input{margin-right:8px}
.q label.ok{background:var(--okbg);border-color:var(--ok)}
.q label.no{background:var(--nobg);border-color:var(--no)}
.ex{margin-top:6px;font-size:.92rem;color:var(--mut)}
button,.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:1rem;cursor:pointer;text-decoration:none;display:inline-block;margin:4px 8px 4px 0}

button.g,.btn.g{background:transparent;color:var(--ac);border:1.5px solid var(--ac)}

button.sp{background:transparent;color:var(--ac);padding:0 6px;margin:0;font-size:1rem}
select{padding:9px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:1rem}
.w{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 14px}
.w i{color:var(--mut)}
.score{font:700 1.6rem Charter,Georgia,serif;margin:10px 0 2px}
footer{border-top:1px solid var(--bd);padding:22px 0 40px;color:var(--mut);font-size:.9rem;text-align:center}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.fi{flex:1;min-width:140px;padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:1rem;font-family:inherit}
button.x{background:transparent;color:var(--no);padding:0 6px;margin:0;font-size:1.1rem}
.fcard{background:var(--card);border:2px solid var(--ac);border-radius:14px;min-height:180px;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;cursor:pointer;font-size:1.25rem;margin:12px 0}
.fcard .big{font:700 2rem Charter,Georgia,serif}
.frow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--bd)}
.frow span{flex:1;min-width:160px;overflow-wrap:anywhere}
.frow .btn{margin:0;padding:7px 14px;font-size:.95rem}
.tag{display:inline-block;font-size:.8rem;padding:1px 8px;border-radius:999px;border:1px solid var(--bd);color:var(--mut);margin-left:6px}

/* Vietnamese font/encoding fix */

/* TOEIC WORLD — playful 3D toy-land theme */
:root{--bg:#dff4ff;--card:#fffdfc;--tx:#35457c;--mut:#6477a5;--bd:#d8e3ff;--ac:#7b5be7;--ok:#168d69;--okbg:#ddfff0;--no:#cf4264;--nobg:#fff0f2;--sel:#f0ebff;--sky:#8dd7ff}

body{background:linear-gradient(#b8e5ff 0,#e9f8ff 360px,#f5fff0 720px,#fff7fc 100%);color:var(--tx);font-family:'Be Vietnam Pro',system-ui,sans-serif;line-height:1.65}
.wrap{max-width:1180px;padding:0 22px}

h1,h2{font-family:'Be Vietnam Pro',sans-serif;font-weight:900;letter-spacing:-.5px}
h1{font-size:clamp(1.9rem,4vw,3.1rem);color:#6747c7;text-shadow:0 2px #fff;margin:.25em 0 .18em}

.lv:after{content:none!important}
.lv:hover{transform:translateY(-5px);box-shadow:0 13px 0 color-mix(in srgb,var(--c) 14%,white),0 22px 32px #6c86bd27}
.lv h2{color:var(--c);font-size:1.6rem;margin:0 0 8px}

.lv:nth-child(1){--c:#21b98a}.lv:nth-child(1):after{content:'🐰'}
.lv:nth-child(2){--c:#5684f6}.lv:nth-child(2):after{content:'🐱'}
.lv:nth-child(3){--c:#ff785f}.lv:nth-child(3):after{content:'🐻'}
.lv:nth-child(4):after{content:'📚'}.lv:nth-child(5):after{content:'🌟'}.lv:nth-child(6):after{content:'🦊'}
.levels .lv:nth-child(n+4){min-height:140px}
.card,.box,.q,.w{border:1px solid #e3e8ff;border-radius:22px;background:rgba(255,255,255,.92);box-shadow:0 7px 20px #6d80bd12;padding:18px 20px}
a.card:hover{border-color:#a89aff;transform:translateY(-2px)}
.tabs{border:0;gap:8px;margin:18px 0}
.tabs a{border:1px solid #e3ddff;border-radius:999px;background:#fff;padding:9px 16px;margin:0;color:#6575a7;font-weight:700}
.tabs a.on{background:linear-gradient(135deg,#8f7aff,#b78cff);color:white;border-color:transparent;box-shadow:0 4px 0 #d7c8ff}
.q{margin:16px 0;padding:19px 21px}

button,.btn{background:linear-gradient(135deg,#ff83b6,#ff6f9f);color:#fff;border:0;border-radius:999px;padding:12px 21px;font-weight:800;box-shadow:0 5px 0 #edb5d0,0 9px 18px #e97ca333;transition:transform .15s,filter .15s}

button.g,.btn.g{background:#fff;color:#7656d9;border:1px solid #dcd3ff;box-shadow:0 4px 0 #eee7ff}
body:not([data-lv]) .btn,body:not([data-lv]) button{background:linear-gradient(135deg,#8a7aff,#b28bff);color:#fff}

select,.fi{border:1.5px solid #dce4ff;border-radius:14px;background:#fff;color:#35457c;padding:11px 13px}
.fcard{border:2px solid #cfc4ff;border-radius:28px;background:linear-gradient(145deg,#fff,#f3efff);box-shadow:0 8px 0 #e4dcff;min-height:200px}
.score{font-family:inherit;color:#7553d6}
footer{background:#ffffff9c;border:0;color:#7080a8;padding:25px 0 38px}
.crumb a{color:#8065d8}
:focus-visible{outline:3px solid #ff9fc4;outline-offset:3px}
/* homepage toy world scene */
.world-hero{position:relative;isolation:isolate;overflow:hidden;border-radius:32px;min-height:370px;padding:35px clamp(20px,4vw,48px);margin:0 0 28px;background:linear-gradient(180deg,#80ccff 0%,#c9efff 54%,#eaffdb 55%,#a9e987 100%);box-shadow:0 10px 0 #d6e8ff,0 20px 35px #6683bd20}

.world-station{position:relative;z-index:2;position:absolute;right:10%;top:27px;background:#fff8d8;border:5px solid #fff;border-radius:22px;padding:13px 22px;text-align:center;color:#e67c5a;font-weight:900;font-size:1.2rem;box-shadow:0 8px 0 #e8c6a0;transform:rotate(2deg)}

.world-tag{display:inline-block;background:#fff;border-radius:15px;padding:8px 13px;color:#6d59c5;font-weight:800;box-shadow:0 4px 0 #e7ddff;margin:4px}
.home-shortcuts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:22px 0}

@media(max-width:760px){.wrap{padding:0 14px}header .wrap{align-items:flex-start}.brand{font-size:1rem}header nav{gap:3px}header nav a{font-size:.78rem;padding:7px 9px}.levels{grid-template-columns:1fr}.lv{min-height:200px}.levels .lv:nth-child(n+4){min-height:130px}.world-hero{min-height:470px;padding:25px 20px}.world-title{max-width:100%}.world-title h1{font-size:2.6rem}.world-station{position:relative;z-index:2;right:12px;top:auto;bottom:140px;font-size:.9rem;padding:8px 12px}.world-mascots{right:8px;bottom:28px;font-size:4.2rem}.world-track{width:70%;bottom:50px}.home-shortcuts{grid-template-columns:repeat(2,minmax(0,1fr))}.home-shortcuts .shortcut:last-child{grid-column:span 2}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;scroll-behavior:auto!important}}


/* Animated 3D toy mascots — CSS-built characters, no emoji characters */
.world-hero{min-height:430px}
.world-mascots{display:flex;align-items:flex-end;gap:clamp(2px,1.4vw,20px);right:4%;bottom:38px;white-space:normal;filter:none;z-index:3}
.toy{--fur:#fff;--ear:#ffb8d1;position:relative;display:inline-block;width:clamp(76px,10vw,126px);height:clamp(104px,13vw,160px);flex:0 0 auto;transform-origin:50% 100%;animation:toyBob 2.2s ease-in-out infinite;filter:drop-shadow(0 12px 6px #497d6c35);perspective:400px}
.toy:nth-child(2){animation-delay:-.5s}.toy:nth-child(3){animation-delay:-1s}.toy:nth-child(4){animation-delay:-1.5s}
.toy .body{position:absolute;width:68%;height:48%;left:16%;bottom:2%;border-radius:48% 48% 38% 38%;background:radial-gradient(circle at 32% 20%,#fff 0 7%,transparent 28%),linear-gradient(135deg,#fff 0%,var(--fur) 48%,color-mix(in srgb,var(--fur),#9ba8cb 22%) 100%);box-shadow:inset -7px -8px 10px #6677a622,inset 5px 5px 9px #fff,0 5px 0 #8e9ab522;transform:rotateX(-5deg)}
.toy .head{position:absolute;width:78%;height:53%;left:11%;top:18%;border-radius:47% 47% 44% 44%;background:radial-gradient(ellipse at 30% 24%,#fff 0 7%,transparent 30%),linear-gradient(145deg,#fff 0%,var(--fur) 60%,color-mix(in srgb,var(--fur),#9ba8cb 18%));box-shadow:inset -7px -7px 9px #6475a522,inset 5px 5px 8px #fff,0 5px 0 #8493b522;z-index:3;animation:headTilt 3.4s ease-in-out infinite}
.toy .eye{position:absolute;width:10%;height:13%;top:48%;left:27%;border-radius:50%;background:radial-gradient(circle at 35% 28%,#fff 0 18%,#59415a 22% 100%);box-shadow:0 1px 2px #3d3159}.toy .eye.right{left:63%}
.toy .cheek{position:absolute;width:17%;height:8%;top:62%;left:17%;border-radius:50%;background:#ff9db7aa;filter:blur(1px)}.toy .cheek.right{left:68%}
.toy .mouth{position:absolute;left:47%;top:63%;width:9%;height:7%;border-bottom:2px solid #9b6179;border-radius:0 0 50% 50%}
.toy .arm{position:absolute;z-index:4;top:62%;left:7%;width:23%;height:23%;border-radius:50%;background:linear-gradient(135deg,#fff,var(--fur));transform:rotate(30deg);box-shadow:inset -3px -3px 5px #7e89a522;animation:wave 1.5s ease-in-out infinite;transform-origin:80% 20%}.toy .arm.right{left:70%;transform:rotate(-30deg);animation-delay:-.7s}
.toy.rabbit{--fur:#fffafc;--ear:#ffb5d0}.toy.rabbit .ear{position:absolute;z-index:1;top:-1%;left:18%;width:27%;height:40%;border-radius:55% 55% 45% 45%;background:linear-gradient(90deg,#fff,#fff);box-shadow:inset -5px -3px 5px #b7a6d455;transform:rotate(-18deg);animation:earWiggle 2.4s ease-in-out infinite}.toy.rabbit .ear:after{content:'';position:absolute;inset:12% 22%;border-radius:inherit;background:linear-gradient(#ffc5dc,#ff9fc7)}.toy.rabbit .ear.second{left:54%;top:-5%;transform:rotate(14deg);animation-delay:-1s}
.toy.cat{--fur:#ffe3c5;--ear:#f6ad9c}.toy.cat .ear{position:absolute;z-index:2;top:13%;left:14%;width:28%;height:28%;background:linear-gradient(135deg,#fff0dc,#eab98f);clip-path:polygon(0 100%,18% 0,100% 80%);filter:drop-shadow(0 3px 1px #98775a44)}.toy.cat .ear.second{left:60%;transform:scaleX(-1)}
.toy.bear{--fur:#c99166;--ear:#e7b18a}.toy.bear .ear{position:absolute;z-index:2;top:18%;left:12%;width:30%;height:30%;border-radius:50%;background:linear-gradient(135deg,#e6b58b,#ad714d);box-shadow:inset -4px -4px 5px #70432e44}.toy.bear .ear.second{left:58%}.toy.bear .muzzle{position:absolute;z-index:4;top:57%;left:34%;width:32%;height:22%;border-radius:50%;background:linear-gradient(135deg,#fff0d9,#eac8a5);box-shadow:inset -3px -3px 4px #a67a5933}.toy.bear .muzzle:after{content:'';position:absolute;top:26%;left:40%;width:20%;height:17%;border-radius:50%;background:#63463d}
.toy.chick{--fur:#ffe77d;--ear:#f9b94c;width:clamp(65px,8vw,100px);height:clamp(85px,10vw,125px)}.toy.chick .head{height:60%;top:20%;border-radius:48% 52% 48% 48%}.toy.chick .beak{position:absolute;z-index:5;left:43%;top:58%;width:18%;height:12%;background:linear-gradient(#ffbd4d,#f58a34);clip-path:polygon(0 0,100% 0,50% 100%)}.toy.chick .wing{position:absolute;z-index:4;top:59%;left:5%;width:25%;height:22%;border-radius:50%;background:linear-gradient(135deg,#fff19a,#f6c94b);transform:rotate(30deg);animation:wave 1.3s ease-in-out infinite}
.toy .shine{position:absolute;z-index:5;top:25%;left:22%;width:12%;height:6%;border-radius:50%;background:#fff9;transform:rotate(-30deg)}
.lv .toy-card{position:absolute;right:12px;bottom:5px;width:88px;height:106px;transform:scale(.72);transform-origin:bottom right;pointer-events:none;filter:drop-shadow(0 7px 4px #596ba833)}
.lv .toy-card .toy{width:100px;height:130px;animation-duration:1.8s}
@keyframes toyBob{0%,100%{translate:0 0;rotate:-2deg}50%{translate:0 -13px;rotate:3deg}}
@keyframes headTilt{0%,100%{rotate:0deg}35%{rotate:3deg}70%{rotate:-3deg}}
@keyframes wave{0%,100%{rotate:0deg}50%{rotate:32deg}}

function stopSpeech(){try{speechSynthesis.cancel()}catch(e){}}
function say(lines,rate){
 if(!("speechSynthesis" in window)){alert("Trình duyệt chưa hỗ trợ đọc tự động. Hãy dùng Chrome hoặc Safari mới.");return}
 stopSpeech();
 const vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)),v=vs.find(v=>/en-US/i.test(v.lang))||vs[0];
 lines.forEach(l=>{const m=/^([MW]):\s*/.exec(l),u=new SpeechSynthesisUtterance(l.replace(/^([MW]):\s*/,""));
  u.lang="en-US";if(v)u.voice=v;u.rate=rate;u.pitch=m?(m[1]==="M"?.8:1.25):1;speechSynthesis.speak(u)});
}
function quiz(box,qs,key,onCheck){
 box.innerHTML=qs.map((x,n)=>`<div class="q"><p><b>${n+1}.</b> ${x.q}</p>`+x.o.map((o,j)=>`<label id="l${n}_${j}"><input type="radio" name="q${n}" value="${j}">${"ABCD"[j]}. ${o}</label>`).join("")+`<div class="ex" id="e${n}"></div></div>`).join("")+`<button id="chk">Chấm điểm</button><div id="res"></div>`;
 $("#chk").onclick=()=>{
  let sc=0;
  qs.forEach((x,n)=>{
   const pick=document.querySelector(`input[name=q${n}]:checked`),a=pick?+pick.value:-1;
   if(a===x.a)sc++;
   box.querySelectorAll(`input[name=q${n}]`).forEach(i=>i.disabled=true);
   $("#l"+n+"_"+x.a).className="ok";
   if(a>=0&&a!==x.a)$("#l"+n+"_"+a).className="no";
   $("#e"+n).textContent=(a===x.a?"Đúng. ":a<0?"Chưa chọn. ":"Sai. ")+"Đáp án: "+"ABCD"[x.a]+". "+x.e;
  });
  const old=LS.get(key),best=old&&old.s>sc?old.s:sc;LS.set(key,{s:best,t:qs.length});
  $("#chk").style.display="none";
  $("#res").innerHTML=`<div class="score">${sc} / ${qs.length}</div><p class="meta">Điểm cao nhất: ${best} / ${qs.length}</p><button onclick="route()">Làm lại</button>`;
  if(onCheck)onCheck();
 };
}

function reviewPage(level){
 const keys=Object.keys(REVIEW),selected=keys.includes(level)?level:"";
 const tabs=`<p class="crumb"><a href="#/">Trang chủ</a> / Kho ôn tập</p><h1>Kho thư viện ôn tập TOEIC</h1><p class="sub">Bài tập luyện tập mới được biên soạn theo các chủ điểm từ tài liệu tham khảo đã tải lên; không sao chép nguyên văn bài tập trong sách. Chọn cấp độ để luyện và xem giải thích sau khi nộp bài.</p><div class="tabs">`+[["","Tất cả cấp độ"],...keys.map(k=>[k,REVIEW[k].title])].map(([k,t])=>`<a class="${k===selected?"on":""}" href="#/library${k?"/"+k:""}">${t}</a>`).join("")+`</div>`;
 if(selected){const b=REVIEW[selected];app.innerHTML=tabs+`<div class="box"><h2>${b.title}</h2><p class="sub">${b.desc}</p><p class="meta">${b.qs.length} câu hỏi · Chấm điểm tự động</p><div id="reviewQuiz"></div></div>`;quiz($("#reviewQuiz"),b.qs,"review-"+selected);return;}
 app.innerHTML=tabs+`<div class="grid">`+keys.map(k=>`<a class="card" href="#/library/${k}"><b>${REVIEW[k].title}</b><span class="meta">${REVIEW[k].qs.length} câu hỏi</span><p class="sub">${REVIEW[k].desc}</p></a>`).join("")+`</div>`;
}

function route(){
 stopSpeech();window.scrollTo(0,0);
 const [lv,sk,i,mode]=(location.hash.slice(2)||"").split("/").filter(Boolean);
 if(lv==="library"){document.body.removeAttribute("data-lv");return reviewPage(sk)}
 if(lv==="lessons"){document.body.removeAttribute("data-lv");return lessonsPage(sk)}
 if(lv==="my"){document.body.removeAttribute("data-lv");return sk?myTopic(sk,i):myHome()}
 document.body.dataset.lv=D[lv]?lv:"";if(!D[lv]){document.body.removeAttribute("data-lv");return home()}
 if(!sk||!TABS.some(t=>t[0]===sk))return list(lv,"listening");
 if(i===undefined)return list(lv,sk);
 item(lv,sk,+i,mode);
}
/* ===== Từ vựng của tôi (lưu trong localStorage, khóa "hub:my") ===== */
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MY={load(){const d=LS.get("my");return Array.isArray(d)?d:[]},save(d){LS.set("my",d)}};
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const myHead=t=>`<p class="crumb"><a href="#/">Trang chủ</a> / <a href="#/my">Từ vựng của tôi</a> / ${esc(t.name)}</p><h1>${esc(t.name)}</h1>`;
function myClean(x){
 if(!Array.isArray(x))return null;
 return x.filter(t=>t&&typeof t.name==="string"&&t.name.trim()&&Array.isArray(t.words)).map(t=>({name:t.name.trim().slice(0,60),words:t.words.filter(w=>w&&typeof w.w==="string"&&typeof w.m==="string"&&w.w.trim()&&w.m.trim()).map(w=>({w:w.w.trim().slice(0,80),t:String(w.t||"").slice(0,12),m:w.m.trim().slice(0,200),e:String(w.e||"").slice(0,300)}))}));
}
function myHome(){
 const d=MY.load();
 app.innerHTML=`<p class="crumb"><a href="#/">Trang chủ</a> / Từ vựng của tôi</p><h1>Từ vựng của tôi</h1><p class="sub">Tự tạo chủ đề, thêm từ mới rồi ôn bằng flashcard và bài kiểm tra. Dữ liệu được lưu ngay trên trình duyệt này.</p>`+
 `<form class="box" id="nt"><b>Tạo chủ đề mới</b><div class="row"><input class="fi" id="tn" placeholder="Tên chủ đề, ví dụ: Email công việc" maxlength="60" required><button>Tạo chủ đề</button></div></form>`+
 `<div class="grid">`+(d.length?d.map(t=>{const b=LS.get("my-"+t.id);return `<a class="card" href="#/my/${t.id}"><b>${esc(t.name)}</b><span class="meta">${t.words.length} từ</span>${b?`<div class="best">Điểm cao nhất: ${b.s}/${b.t}</div>`:""}</a>`}).join(""):`<p class="meta">Bạn chưa có chủ đề nào. Hãy tạo chủ đề đầu tiên ở trên.</p>`)+`</div>`+
 `<h2>Sao lưu</h2><p class="sub">Dữ liệu chỉ nằm trên trình duyệt này. Hãy xuất file để sao lưu hoặc chuyển sang thiết bị khác, rồi nhập lại bằng nút bên dưới.</p><button class="g" id="ex">Xuất file JSON</button><button class="g" id="im">Nhập file JSON</button><input type="file" id="imf" accept=".json,application/json" hidden><div id="msg" class="meta" role="status"></div>`;
 $("#nt").onsubmit=e=>{e.preventDefault();const name=$("#tn").value.trim();if(!name)return;const t={id:newId(),name:name.slice(0,60),words:[]};const d=MY.load();d.push(t);MY.save(d);location.hash="#/my/"+t.id};
 $("#ex").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(MY.load(),null,1)],{type:"application/json"}));a.download="tu-vung-cua-toi.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
 $("#im").onclick=()=>$("#imf").click();
 $("#imf").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
   let x=null;try{x=myClean(JSON.parse(r.result))}catch(err){}
   if(!x){$("#msg").textContent="File không hợp lệ. Hãy chọn file JSON đã xuất từ trang này.";return}
   const d=MY.load();let add=0;
   x.forEach(t=>{let c=d.find(y=>y.name===t.name);if(!c){c={id:newId(),name:t.name,words:[]};d.push(c)}
    t.words.forEach(w=>{if(!c.words.some(v=>v.w.toLowerCase()===w.w.toLowerCase()&&v.m===w.m)){c.words.push(w);add++}})});
   MY.save(d);myHome();$("#msg").textContent="Đã nhập "+add+" từ mới.";
  };
  r.readAsText(f);
 };
}
function myTopic(id,mode){
 const d=MY.load(),t=d.find(x=>x.id===id);
 if(!t){location.hash="#/my";return}
 const n=t.words.length,back=`<p><a href="#/my/${t.id}">← Quay lại chủ đề</a></p>`;
 if(mode==="quiz"){
  const ms=[...new Set(t.words.map(x=>x.m))];
  if(ms.length<2){app.innerHTML=myHead(t)+back+`<p class="sub">Cần ít nhất 2 từ có nghĩa khác nhau để làm bài kiểm tra.</p>`;return}
  const qs=shuffle(t.words).map(x=>{const o=shuffle([x.m,...shuffle(ms.filter(m=>m!==x.m)).slice(0,3)]);return Q(`Nghĩa của <b>${esc(x.w)}</b> là gì?`,o.map(esc),o.indexOf(x.m),`${x.w}${x.t?` (${x.t})`:""}: ${x.m}.${x.e?" Ví dụ: "+x.e:""}`)});
  app.innerHTML=myHead(t)+back+`<h2>Kiểm tra</h2><div id="qb"></div>`;
  quiz($("#qb"),qs,"my-"+t.id);return;
 }
 if(mode==="flash"){
  if(!n){app.innerHTML=myHead(t)+back+`<p class="sub">Chủ đề chưa có từ nào. Hãy thêm từ trước khi ôn flashcard.</p>`;return}
  let deck=t.words.slice(),i=0,show=false;
  app.innerHTML=myHead(t)+back+`<h2>Flashcard</h2><div id="fc"></div>`;
  const draw=()=>{
   const x=deck[i];
   $("#fc").innerHTML=`<div class="fcard" id="card" tabindex="0" role="button" aria-label="Lật thẻ">${show?`<div><b>${esc(x.m)}</b>${x.e?`<div class="ex">${esc(x.e)}</div>`:""}</div>`:`<div><span class="big">${esc(x.w)}</span>${x.t?` <i>(${esc(x.t)})</i>`:""}</div>`}</div><p class="meta">Thẻ ${i+1} / ${deck.length}. Bấm vào thẻ để lật.</p><button class="g" id="pv">← Trước</button><button id="nx">Sau →</button><button class="g" id="sh">Xáo trộn</button><button class="g" id="sd">🔊 Nghe</button>`;
   const flip=()=>{show=!show;draw();$("#card").focus()};
   $("#card").onclick=flip;
   $("#card").onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();flip()}};
   $("#pv").onclick=()=>{i=(i-1+deck.length)%deck.length;show=false;draw()};
   $("#nx").onclick=()=>{i=(i+1)%deck.length;show=false;draw()};
   $("#sh").onclick=()=>{deck=shuffle(deck);i=0;show=false;draw()};
   $("#sd").onclick=()=>say([x.w],.9);
  };
  draw();return;
 }
 app.innerHTML=myHead(t)+`<p><a href="#/my">← Quay lại danh sách</a></p><p><a class="btn" href="#/my/${t.id}/flash">Flashcard</a><a class="btn" href="#/my/${t.id}/quiz">Làm bài kiểm tra</a><button class="g" id="rn">Đổi tên</button><button class="g" id="dt">Xóa chủ đề</button></p>`+
 `<form class="box" id="nw"><b>Thêm từ mới</b><div class="row"><input class="fi" id="fw" placeholder="Từ tiếng Anh" maxlength="80" required><select class="fi" id="ft" aria-label="Loại từ"><option value="">Loại từ</option><option>n</option><option>v</option><option>adj</option><option>adv</option><option>prep</option></select></div><div class="row"><input class="fi" id="fm" placeholder="Nghĩa tiếng Việt" maxlength="200" required></div><div class="row"><input class="fi" id="fe" placeholder="Câu ví dụ (không bắt buộc)" maxlength="300"></div><button>Thêm từ</button></form>`+
 `<h2>${n} từ</h2>`+(n?`<div class="grid">`+t.words.map((x,k)=>`<div class="w"><button class="x" style="float:right" data-del="${k}" aria-label="Xóa từ ${esc(x.w)}">✕</button><b>${esc(x.w)}</b>${x.t?` <i>(${esc(x.t)})</i>`:""} <button class="sp" data-w="${esc(x.w)}" aria-label="Nghe phát âm ${esc(x.w)}">🔊</button><div>${esc(x.m)}</div>${x.e?`<div class="ex">${esc(x.e)}</div>`:""}</div>`).join("")+`</div>`:`<p class="meta">Chưa có từ nào. Hãy thêm từ đầu tiên ở trên.</p>`);
 $("#nw").onsubmit=e=>{e.preventDefault();const w=$("#fw").value.trim(),m=$("#fm").value.trim();if(!w||!m)return;t.words.push({w,t:$("#ft").value,m,e:$("#fe").value.trim()});MY.save(d);myTopic(id);$("#fw").focus()};
 document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{t.words.splice(+b.dataset.del,1);MY.save(d);myTopic(id)});
 $("#rn").onclick=()=>{const v=prompt("Tên mới cho chủ đề:",t.name);if(v&&v.trim()){t.name=v.trim().slice(0,60);MY.save(d);myTopic(id)}};
 $("#dt").onclick=()=>{if(confirm(`Xóa chủ đề "${t.name}" và toàn bộ ${n} từ trong đó?`)){MY.save(d.filter(x=>x!==t));try{localStorage.removeItem("hub:my-"+t.id)}catch(e){}location.hash="#/my"}};
}
/* ===== Bài giảng: danh sách đọc từ lessons.json (giáo viên chỉnh file này trên GitHub) ===== */
let lessonTok=0;
const OFFICE=["ppt","pptx","pps","ppsx","doc","docx","xls","xlsx"];
function lessonFile(f){
 if(!f||typeof f!=="object")return null;
 let u;try{u=new URL(String(f.file||f.url||""),location.href)}catch(e){return null}
 if(u.protocol!=="https:"&&u.protocol!=="http:"&&u.protocol!==location.protocol)return null;
 const ext=String(f.type||(u.pathname.match(/\.(\w+)$/)||[])[1]||"").toLowerCase();
 const web=/^https?:$/.test(u.protocol),office=OFFICE.includes(ext)&&web;
 return{
  name:String(f.name||u.pathname.split("/").pop()||"Tài liệu"),
  href:u.href,
  view:office?"https://view.officeapps.live.com/op/view.aspx?src="+encodeURIComponent(u.href):u.href,
  icon:ext==="pdf"?"📄":/^pp/.test(ext)?"📊":OFFICE.includes(ext)?"📝":"🔗",
  down:ext==="pdf"||OFFICE.includes(ext)
 };
}
async function lessonsPage(flt){
 const tok=++lessonTok,keys=Object.keys(D),f=keys.includes(flt)?flt:"";
 const head=`<p class="crumb"><a href="#/">Trang chủ</a> / Bài giảng</p><h1>Bài giảng</h1><p class="sub">Slide và tài liệu của từng buổi học do giáo viên cập nhật. Bấm "Xem" để mở ngay hoặc "Tải về" để lưu vào máy.</p><div class="tabs">`+
  [["","Tất cả"],...keys.map(k=>[k,D[k].n])].map(([k,t])=>`<a class="${k===f?"on":""}" href="#/lessons${k?"/"+k:""}">${t}</a>`).join("")+`</div>`;
 app.innerHTML=head+`<p class="meta" role="status">Đang tải danh sách bài giảng...</p>`;
 let data=[];
 try{const r=await fetch("lessons.json",{cache:"no-store"});if(r.ok){const j=await r.json();data=Array.isArray(j)?j:Array.isArray(j&&j.lessons)?j.lessons:[]}}catch(e){}
 if(tok!==lessonTok)return;
 const items=data.filter(l=>l&&typeof l.title==="string"&&(!f||!l.level||l.level===f)).sort((a,b)=>(+b.buoi||0)-(+a.buoi||0));
 const manager=`<details class="box"><summary style="cursor:pointer;font-weight:700">＋ Giáo viên: thêm bài giảng / tải tệp</summary>
 <p class="meta">Tạo bài giảng và xuất lessons.json. GitHub Pages là website tĩnh nên biểu mẫu không thể tự ghi file lên GitHub. Sau khi xuất JSON, hãy tải tài liệu lên thư mục assets/lessons/ trong repository.</p>
 <form id="lessonForm"><div class="row"><input class="fi" id="lessonTitle" maxlength="160" placeholder="Tên bài giảng" required><input class="fi" id="lessonBuoi" type="number" min="1" placeholder="Buổi số"></div>
 <div class="row"><select class="fi" id="lessonLevel"><option value="">Chưa phân cấp độ</option><option value="starter">Starter</option><option value="intermediate">Intermediate</option><option value="advanced">Advanced</option></select><input class="fi" id="lessonDate" placeholder="Ngày học"></div>
 <textarea class="fi" id="lessonNote" rows="2" maxlength="1000" placeholder="Ghi chú bài giảng"></textarea>
 <p><label for="lessonFiles"><b>Chọn file tài liệu</b> (PDF, PowerPoint, Word, Excel...)</label><br><input id="lessonFiles" type="file" multiple accept=".pdf,.ppt,.pptx,.pps,.ppsx,.doc,.docx,.xls,.xlsx,.txt,.mp3,.mp4"></p>
 <div id="lessonFileNames" class="meta">Chưa chọn tệp.</div><button type="submit">Thêm bài giảng</button><button type="button" class="g" id="downloadLessons">Tải lessons.json</button><div id="lessonMsg" class="meta" role="status"></div></form></details>`;
 app.innerHTML=head+manager+(items.length?items.map(l=>{
  const fs=(Array.isArray(l.files)?l.files:[]).map(lessonFile).filter(Boolean),lv=typeof l.level==="string"&&keys.includes(l.level)?D[l.level]:null;
  return `<div class="box"><b>${l.buoi?`Buổi ${esc(l.buoi)} – `:""}${esc(l.title)}</b>${lv?`<span class="tag">${lv.n}</span>`:""}${l.date?` <span class="meta">· ${esc(l.date)}</span>`:""}${l.note?`<p class="sub" style="margin:6px 0 8px">${esc(l.note)}</p>`:""}`+
   (fs.length?fs.map(x=>`<div class="frow"><span>${x.icon} ${esc(x.name)}</span><a class="btn" href="${esc(x.view)}" target="_blank" rel="noopener">Xem</a>${x.down?`<a class="btn g" href="${esc(x.href)}" download>Tải về</a>`:""}</div>`).join(""):`<p class="meta" style="margin:6px 0 0">Chưa có tệp đính kèm.</p>`)+`</div>`;
 }).join(""):`<p class="meta">Chưa có bài giảng nào. Giáo viên sẽ cập nhật sau mỗi buổi học.</p>`);
 const exportData=data.slice(), filesInput=$("#lessonFiles"), fileNames=$("#lessonFileNames"), form=$("#lessonForm"), msg=$("#lessonMsg");
 filesInput.onchange=()=>{fileNames.textContent=filesInput.files.length?[...filesInput.files].map(x=>x.name).join(" · "):"Chưa chọn tệp.";};
 form.onsubmit=e=>{
  e.preventDefault();const title=$("#lessonTitle").value.trim(), selected=[...filesInput.files];
  if(!title){msg.textContent="Hãy nhập tên bài giảng.";return}
  if(!selected.length){msg.textContent="Hãy chọn ít nhất một tệp tài liệu.";return}
  const files=selected.map(file=>({name:file.name,file:"assets/lessons/"+file.name,type:(file.name.split(".").pop()||"").toLowerCase()}));
  exportData.push({title,buoi:$("#lessonBuoi").value?Number($("#lessonBuoi").value):"",level:$("#lessonLevel").value,date:$("#lessonDate").value.trim(),note:$("#lessonNote").value.trim(),files});
  msg.textContent="Đã thêm vào danh sách xuất ("+exportData.length+" bài). Nhấn Tải lessons.json.";
  form.reset();fileNames.textContent="Chưa chọn tệp.";
 };
 $("#downloadLessons").onclick=()=>{
  const blob=new Blob([JSON.stringify(exportData,null,2)],{type:"application/json;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="lessons.json";a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  msg.textContent="Đã tạo lessons.json. Hãy thay file này trong GitHub và tải tài liệu lên assets/lessons/.";
 };
}
document.addEventListener("click",e=>{const b=e.target.closest(".sp");if(b)say([b.dataset.w],.9)});
window.addEventListener("hashchange",route);route();
</script>
